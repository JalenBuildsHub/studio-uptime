name: studio-uptime

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe flagship domains
        shell: bash
        run: |
          set -u
          failed=0
          for url in \
            https://www.swingersclubllc.com \
            https://18holestohome.com \
            https://jalenbuilds.com \
            https://nymrel.com \
            https://draftadynasty.com \
            https://tradinginspired.com \
            https://toptiermovingjunk.com \
            https://1stchoicefire.com \
            https://oregongreens.co \
            https://golfflow.jalentrades.com \
            https://www.jalentrades.com; do
            if ! code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$url"); then
              code=000
            fi
            if [ "$code" != "200" ]; then
              sleep 10
              if ! code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$url"); then
                code=000
              fi
            fi
            if [ "$code" != "200" ]; then
              echo "::error::DOWN $url (HTTP $code after retry)"
              failed=1
            else
              echo "OK  $url"
            fi
          done
          exit $failed
